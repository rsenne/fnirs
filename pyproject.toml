[project]
name = "fnirs-glmhmm"
version = "0.1.0"
description = "GLM-HMM analysis of gradCPT fNIRS data"
readme = "README.md"
authors = [
    { name = "Ryan Senne", email = "rsenne@bu.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "dynamax>=0.1.5",
    "jax>=0.4.35",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "xarray>=2024.9",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "marimo>=0.9",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# a bare expression at the end of a marimo cell is how you render output
"notebooks/*" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
